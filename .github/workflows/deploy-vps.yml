name: Build and Deploy to VPS

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: orakull/casanostra

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write Secrets.kt
        run: |
          cat > composeApp/src/commonMain/kotlin/com/orakull/casanostra/Secrets.kt <<'EOF'
          package com.orakull.casanostra

          object Secrets {
              const val SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
              const val SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Build WasmJs distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Prepare dist/ for Docker build
        run: cp -r composeApp/build/dist/wasmJs/productionExecutable dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            docker-compose.yml

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/nginx-host.conf,docker-compose.yml"
          target: /opt/casanostra
          overwrite: true

      - name: SSH deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/casanostra

            # Configure host nginx reverse proxy (idempotent)
            sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/casanostra
            sudo ln -sf /etc/nginx/sites-available/casanostra /etc/nginx/sites-enabled/casanostra
            sudo nginx -t && sudo systemctl reload nginx

            # Pull and restart container
            docker compose pull casanostra-web
            docker compose up -d casanostra-web
            docker image prune -f
