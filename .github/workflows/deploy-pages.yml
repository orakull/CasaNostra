name: Deploy to GitHub Pages

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WasmJs distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Disable Jekyll
        run: touch composeApp/build/dist/wasmJs/productionExecutable/.nojekyll

      - name: Fix base path for GitHub Pages
        run: |
          sed -i 's|<base href="/">|<base href="/CasaNostra/">|' \
            composeApp/build/dist/wasmJs/productionExecutable/index.html

      - name: Add SPA fallback for GitHub Pages
        run: |
          cp composeApp/build/dist/wasmJs/productionExecutable/index.html \
             composeApp/build/dist/wasmJs/productionExecutable/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
