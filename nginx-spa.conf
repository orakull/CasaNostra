server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required for WebAssembly — browsers refuse to run .wasm without this MIME type
    types {
        application/wasm wasm;
        text/html        html htm;
        text/css         css;
        application/javascript js;
        image/png        png;
        image/svg+xml    svg;
        image/x-icon     ico;
        font/woff2       woff2;
        font/woff        woff;
    }

    # SPA fallback — every unknown path returns index.html with HTTP 200
    # This is what makes /workspace/{token} work client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressively cache static assets (content-hashed filenames)
    location ~* \.(js|wasm|css|png|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it must always be fresh
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
