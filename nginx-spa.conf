server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required for WebAssembly — browsers refuse to run .wasm without this MIME type
    types {
        application/wasm wasm;
        text/html        html htm;
        text/css         css;
        application/javascript js;
        image/png        png;
        image/svg+xml    svg;
        image/x-icon     ico;
        font/woff2       woff2;
        font/woff        woff;
    }

    # SPA fallback — every unknown path returns index.html with HTTP 200
    # This is what makes /workspace/{token} work client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Required for SharedArrayBuffer (Kotlin/Wasm threading)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # WASM files are content-hashed by Kotlin/Wasm toolchain — safe to cache forever
    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # JS/CSS/assets — filenames are NOT content-hashed, must revalidate on each deploy
    location ~* \.(js|css|png|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Never cache index.html — it must always be fresh
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
